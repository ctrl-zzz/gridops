name: Build and publish container image

on:
  push:
    branches:
      - main
    paths:
      - "gridops/app/backend/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tag
        id: image
        run: |
          echo "tag=$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./gridops/app/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gridops:${{ steps.image.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/gridops:latest