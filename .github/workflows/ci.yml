name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff lint
        run: ruff check app/backend

      - name: Check Ruff formatting
        run: ruff format --check app/backend