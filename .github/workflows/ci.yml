name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff lint
        run: ruff check app/backend

      - name: Check Ruff formatting
        run: ruff format --check app/backend

  kustomize-render:
    name: Kustomize render and schema validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install kubeconform
        run: |
          curl -L \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform

      - name: Render all Kustomizations
        shell: bash
        run: |
          find app flux infra -name 'kustomization.yaml' -print0 |
          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            echo "Rendering $dir"
            kubectl kustomize "$dir" > /dev/null || exit 1
          done

      - name: Validate Kubernetes schemas
        shell: bash
        run: |
          find app flux infra -name 'kustomization.yaml' -print0 |
          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            echo "Validating $dir"

            kubectl kustomize "$dir" |
              kubeconform \
                -kubernetes-version 1.35.1 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/kustomize.toolkit.fluxcd.io/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/source.toolkit.fluxcd.io/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/image.toolkit.fluxcd.io/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/helm.toolkit.fluxcd.io/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cert-manager.io/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/cilium.io/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.envoyproxy.io/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -skip CustomResourceDefinition \
                -summary || exit 1
          done

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3