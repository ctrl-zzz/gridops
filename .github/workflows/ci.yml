name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff lint
        run: ruff check app/backend

      - name: Check Ruff formatting
        run: ruff format --check app/backend

  kustomize-render:
    name: Kustomize render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render all Kustomizations
        shell: bash
        run: |
          find app flux infra -name 'kustomization.yaml' -print0 |
          while IFS= read -r -d '' file; do
            dir="$(dirname "$file")"
            echo "Rendering $dir"
            kubectl kustomize "$dir" > /dev/null || exit 1
          done
