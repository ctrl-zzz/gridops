apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    cert-manager.io/cluster-issuer: local-ca-issuer
  name: gateway-api
  namespace: infra-gateways
  labels:
    name: gateway-api
    component: gateway
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: eg-config
  listeners:
    - name: https
      protocol: HTTPS
      hostname: gridops.local
      port: 443
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: app
      tls:
        mode: Terminate
        certificateRefs:
        - kind: Secret
          name: gridops-tls
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
