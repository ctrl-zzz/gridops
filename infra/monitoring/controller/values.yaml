apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-prometheus-stack-values
  namespace: monitoring
data:
  values.yaml: |
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      additionalDataSources:
        - name: Tempo
          uid: tempo
          type: tempo
          access: proxy
          url: http://tempo.monitoring.svc.cluster.local:3200
          isDefault: false
          jsonData:
            nodeGraph:
              enabled: true

    kubeControllerManager:
      enabled: false

    kubeEtcd:
      enabled: false

    kubeProxy:
      enabled: false

    kubeScheduler:
      enabled: false

    prometheus:
      prometheusSpec:
        retention: 7d
        scrapeInterval: 30s

    alertmanager:
      enabled: true
