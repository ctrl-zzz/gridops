apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api-crds
  namespace: infrastructure
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  path: ./k9s_project/infra/gateway-api
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
