apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-envoy-egress-to-app
  namespace: infra-gateways
specs:
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/instance: eg
    egress:
      # This makes sure envoy can communicate with its other pods
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: infra-gateways
              app.kubernetes.io/component: proxy
              app.kubernetes.io/name: envoy

      - toEntities:
          - kube-apiserver

  - endpointSelector:
      matchLabels:
        app.kubernetes.io/component: proxy
        app.kubernetes.io/name: envoy

    egress:
      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: kube-system
              k8s:k8s-app: kube-dns
        toPorts:
          - ports:
              - port: "53"
                protocol: UDP
              - port: "53"
                protocol: TCP

      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: infra-gateways
              app.kubernetes.io/instance: envoy
              app.kubernetes.io/name: gateway-helm
        toPorts:
          - ports:
              - port: "18000"
                protocol: TCP

      - toEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: app
        toPorts:
          - ports:
              - port: "8000"
                protocol: TCP
