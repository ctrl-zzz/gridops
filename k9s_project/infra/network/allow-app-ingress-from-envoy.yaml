apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-app-ingress-from-envoy
  namespace: app
specs:
  - endpointSelector: {}
    ingress:
      - fromEndpoints:
          - matchLabels:
              k8s:io.kubernetes.pod.namespace: envoy-gateway-system
        toPorts:
          - ports:
              - port: "80"
                protocol: TCP