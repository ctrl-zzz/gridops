apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apigw-system
resources:
  - github.com/kubernetes-sigs/gateway-api/config/crd?ref=v1.6.2

labels:
  - pairs:
      app.kubernetes.io/instance: gateway-api
      app.kubernetes.io/managed-by: flux
