apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifest published by the metrics-server project.
# Kustomize downloads it and uses it as the starting point.
resources:
  - https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.8.1/components.yaml
  - certificate.yaml

patches:
  # Patch the metrics-server Deployment generated from the upstream manifest.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: metrics-server
      namespace: kube-system
    patch: |-
      # Remove the default --cert-dir=/tmp argument.
      # That argument makes metrics-server generate/use its own temporary self-signed certificate.
      - op: remove
        path: /spec/template/spec/containers/0/args/0

      # Keep the insecure kubelet TLS option.
      # This affects metrics-server -> kubelet communication, not API server -> metrics-server.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls

      # Tell metrics-server to use the certificate generated by cert-manager.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tls-cert-file=/etc/metrics-server/tls/tls.crt

      # Tell metrics-server to use the matching private key generated by cert-manager.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --tls-private-key-file=/etc/metrics-server/tls/tls.key

      # Mount the TLS Secret inside the metrics-server container.
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: metrics-server-tls
            mountPath: /etc/metrics-server/tls
            readOnly: true

      # Define the volume backed by the Kubernetes Secret created by cert-manager.
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: metrics-server-tls
            secret:
              secretName: metrics-server-tls