apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gw
  namespace: infra-gateways
spec:
  interval: 1m
  releaseName: envoy
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      interval: 1m
      chart: gateway-helm
      version: 1.7.2
      sourceRef:
        kind: HelmRepository
        name: envoy
        namespace: infra-gateways
