apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gw
  namespace: envoy-gateway-system
spec:
  interval: 1m
  releaseName: envoy
  install:
    crds: Skip
  upgrade:
    crds: Skip
  chart:
    spec:
      interval: 1m
      chart: gateway-helm
      version: 1.7.2
      sourceRef:
        kind: HelmRepository
        name: envoy
        namespace: flux-system