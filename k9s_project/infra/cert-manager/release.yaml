apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager
      version: 1.19.5
      sourceRef:
        kind: HelmRepository
        name: cert-manager
  releaseName: cert-manager
  values:
    apiVersion: "controller.config.cert-manager.io/v1alpha1"
    kind: ControllerConfiguration
    enableGatewayAPI: true