apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
  labels:
    app.kubernetes.io/version: 1.19.5
spec:
  interval: 1m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  chart:
    spec:
      chart: cert-manager
      version: 1.19.5
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: cert-manager
      interval: 1m
  releaseName: cert-manager
  values:
    crds:
      enabled: true
    config:
      apiVersion: "controller.config.cert-manager.io/v1alpha1"
      kind: ControllerConfiguration
      enableGatewayAPI: true
