apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app
  namespace: app
spec:
  dependsOn:
    - name: gateway-api-crds
      namespace: infrastructure
    - name: monitoring
      namespace: monitoring
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./gridops/app
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: f1-backend
      namespace: app
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
