apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
  namespace: infra-gateways
spec:
  dependsOn:
    - name: gateway-api-crds
      namespace: infrastructure
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./gridops/infra/envoy-gw/controller
  prune: true
  wait: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: envoy-gw
      namespace: infra-gateways
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
