apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-config
  namespace: cert-manager
spec:
  dependsOn:
    - name: cert-manager
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./gridops/infra/cert-manager/config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
