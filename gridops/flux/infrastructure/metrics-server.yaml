apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: infrastructure
spec:
  dependsOn:
    - name: cert-manager-config
      namespace: cert-manager
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./gridops/infra/metrics-server
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
