apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1-backend
  labels:
    app: f1-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: f1-backend
  template:
    metadata:
      labels:
        app: f1-backend
    spec:
      imagePullSecrets:
        - name: ghcr-credentials

      containers:
        - name: f1-backend
          image: ghcr.io/ctrl-zzz/gridops:988f7d44a5148c5cf7bfca20fa0f900c5c6ce8be # {"$imagepolicy": "flux-system:gridops"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            # - name: metrics
            #   containerPort: 9090
