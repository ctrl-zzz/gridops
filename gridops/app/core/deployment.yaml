apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1-backend
  labels:
    app: f1-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: f1-backend
  template:
    metadata:
      labels:
        app: f1-backend
    spec:
      imagePullSecrets:
        - name: ghcr-credentials

      containers:
        - name: f1-backend
          image: ghcr.io/ctrl-zzz/gridops:sha256:e3081e50116e73fb15a03a83dfb08d6681d86914d43849ab9e406961e39ecc35
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            # - name: metrics
            #   containerPort: 9090
