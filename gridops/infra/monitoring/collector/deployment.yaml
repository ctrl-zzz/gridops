apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-collector
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentelemetry-collector
  template:
    metadata:
      labels:
        app: opentelemetry-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.134.0
          args:
            - "--config=/etc/otelcol/config.yaml"

          ports:
            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318

          volumeMounts:
            - name: config
              mountPath: /etc/otelcol

      volumes:
        - name: config
          configMap:
            name: opentelemetry-collector