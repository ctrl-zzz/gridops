apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
  labels:
    app.kubernetes.io/version: 1.19.4
spec:
  interval: 1m
  releaseName: cilium
  chart:
    spec:
      interval: 1m
      chart: cilium
      version: 1.19.4
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
  values:
    kubeProxyReplacement: true
    k8sServiceHost: demo-cluster-control-plane
    k8sServicePort: 6443
    l2announcements:
      enabled: true
    k8sClientRateLimit:
      qps: 32
      burst: 40
