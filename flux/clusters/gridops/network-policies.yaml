apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-policies
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: cilium
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./infra/network
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
