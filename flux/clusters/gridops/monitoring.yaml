apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization

metadata:
  name: monitoring
  namespace: flux-system

spec:
  dependsOn:
  - name: namespaces
  interval: 10m
  retryInterval: 1m
  timeout: 15m

  path: ./infra/monitoring

  prune: true
  wait: true

  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kube-prometheus-stack
      namespace: monitoring

  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system