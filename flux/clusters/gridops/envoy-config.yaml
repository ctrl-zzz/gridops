apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-config
  namespace: flux-system
spec:
  dependsOn:
    - name: envoy-gateway
    - name: cert-manager-config
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./infra/envoy-gw/config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
